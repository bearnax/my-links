name: Build and deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# The site is a build artifact now, so GitHub Pages has to be served from
# Actions rather than from a branch: Settings -> Pages -> Build and deployment
# -> Source -> "GitHub Actions".
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Check the build produced a page
        run: test -s _site/index.html && test -s _site/style.css

      - name: Test the site in Chrome
        if: github.event_name == 'pull_request'
        run: |
          npm install --prefix "$RUNNER_TEMP/links-browser" playwright@1.56.1
          python3 -m http.server 8080 --bind localhost --directory _site &
          trap 'kill "$!"' EXIT
          for attempt in {1..10}; do
            if curl -fsS http://localhost:8080/ >/dev/null; then break; fi
            sleep 1
          done
          NODE_PATH="$RUNNER_TEMP/links-browser/node_modules" node tests/site-smoke.cjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
