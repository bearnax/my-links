name: Build and deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# The site is a build artifact now, so GitHub Pages has to be served from
# Actions rather than from a branch: Settings -> Pages -> Build and deployment
# -> Source -> "GitHub Actions".
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Load live data for draft PR 18
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 18 && github.event.pull_request.head.repo.full_name == github.repository
        id: live
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: |
          if [ -z "$AIRTABLE_TOKEN" ]; then
            echo "::notice::No Airtable secret is configured for the live preview."
            exit 0
          fi
          python3 scripts/init-base.py --refresh
          python3 scripts/sync-links.py
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Build and test
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            published_at=$(git log --first-parent -1 --format=%cI -- data/links.json)
            export LINKS_PUBLISHED_AT="$published_at"
          fi
          npm test

      - name: Check the build produced a page
        run: test -s _site/index.html && test -s _site/style.css

      - name: Test the site in Chrome
        if: github.event_name == 'pull_request'
        run: |
          npm install --prefix "$RUNNER_TEMP/links-browser" playwright@1.56.1
          python3 -m http.server 8080 --bind localhost --directory _site &
          trap 'kill "$!"' EXIT
          for attempt in {1..10}; do
            if curl -fsS http://localhost:8080/ >/dev/null; then break; fi
            sleep 1
          done
          NODE_PATH="$RUNNER_TEMP/links-browser/node_modules" node tests/site-smoke.cjs

      - name: Attach the validated snapshot to PR 18
        if: steps.live.outputs.ready == 'true'
        env:
          REVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --quiet -- data/links.json data/airtable-schema.json && exit 0
          git switch --detach "$REVIEW_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/links.json data/airtable-schema.json
          git commit -m "Sync live Airtable data for review"
          git push origin HEAD:refs/heads/codex/links-directory-refresh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
