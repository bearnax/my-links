name: Build and deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# The site is a build artifact now, so GitHub Pages has to be served from
# Actions rather than from a branch: Settings -> Pages -> Build and deployment
# -> Source -> "GitHub Actions".
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Offline checks only — no token needed. Catches a fork whose schema or
      # site.json was never filled in, before the build produces a page that
      # says "undefined" in the title.
      - name: Check the site config
        run: python3 scripts/doctor.py

      - run: npm ci

      - run: npm run build

      - name: Check the build produced a page
        run: test -s _site/index.html && test -s _site/style.css

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Only the sites hosted on GitHub Pages deploy from here. Sibling sites on
  # Cloudflare (which builds and deploys from its own git integration) leave
  # DEPLOY_TARGET unset, so this job skips instead of failing on every push.
  # Set the repo variable to 'github-pages' under Settings -> Secrets and
  # variables -> Actions -> Variables to turn it on.
  deploy:
    if: vars.DEPLOY_TARGET == 'github-pages' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
