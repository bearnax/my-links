name: Sync links data from Airtable

on:
  workflow_dispatch: {}
  schedule:
    # Weekday mornings, off the hour so this is not queued with everything
    # else that runs at :00.
    - cron: "23 12 * * 1-5"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build links.json from Airtable
        env:
          # A personal access token scoped to the Links CMS base. Read-only is
          # enough — this job never writes back to Airtable.
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: |
          if [ -z "$AIRTABLE_TOKEN" ]; then
            echo "::error::AIRTABLE_TOKEN secret is not set. Create a token with data.records:read scoped to the Links CMS base and add it as a repository secret."
            exit 1
          fi
          python3 scripts/sync-links.py /tmp/links-sync-out.json 2>&1 | tee /tmp/links-sync.log
          exit "${PIPESTATUS[0]}"
        shell: bash

      - name: Report sync failure
        if: failure()
        run: |
          {
            echo "### Airtable sync failed"
            echo '```'
            tail -c 4000 /tmp/links-sync.log 2>/dev/null || echo "(no log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Surface warnings
        if: success()
        run: |
          # Warnings mean a record could not be placed — a person with no
          # section, say. The sync deliberately does not fail on these, so
          # they need somewhere visible to land.
          if grep -q '^warning:' /tmp/links-sync.log; then
            {
              echo "### Records skipped"
              echo '```'
              grep '^warning:' /tmp/links-sync.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Diff against data/links.json
        id: diff
        run: |
          if diff -q /tmp/links-sync-out.json data/links.json > /dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          python3 scripts/diff-links.py data/links.json /tmp/links-sync-out.json > /tmp/links-sync-summary.md
          cat /tmp/links-sync-summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        if: steps.diff.outputs.changed == 'true'
        with:
          node-version: "22"
          cache: npm

      - name: Check the site still builds with the new data
        if: steps.diff.outputs.changed == 'true'
        run: |
          # The PR would deploy on merge, so a build failure should surface
          # here rather than on main.
          cp /tmp/links-sync-out.json data/links.json
          npm ci
          npm run build
          test -s _site/index.html

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          # A PAT with repo scope in SYNC_PR_TOKEN lets the job open the PR even when
          # "Allow GitHub Actions to create and approve pull requests" is turned off.
          GH_TOKEN: ${{ secrets.SYNC_PR_TOKEN || github.token }}
        run: |
          branch="links-sync-$(date +%Y%m%d)"

          if gh pr list --head "$branch" --state open --json number --jq '. | length' | grep -qv '^0$'; then
            echo "An open PR already exists for branch $branch; skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$branch"
          git add data/links.json
          git commit -m "Sync links data from Airtable"

          # Force is safe here: we bailed out above if an open PR targets this branch,
          # and links-sync-* branches are only ever written by this job. It lets a
          # rerun replace a leftover branch from an earlier run that failed after push.
          git push --force -u origin "$branch"

          if gh pr create \
            --title "Sync links data from Airtable ($(date +%Y-%m-%d))" \
            --body-file /tmp/links-sync-summary.md \
            --base main \
            --head "$branch" 2> /tmp/links-sync-pr.log; then
            exit 0
          fi

          cat /tmp/links-sync-pr.log >&2

          if ! grep -q "not permitted to create or approve pull requests" /tmp/links-sync-pr.log; then
            exit 1
          fi

          # The synced data is pushed and safe; only PR creation is blocked by repo
          # policy. Surface the compare link instead of failing the whole sync.
          {
            echo "### Branch pushed, but the pull request could not be opened"
            echo
            echo "GitHub Actions is not allowed to create pull requests in this repository."
            echo "Turn on **Settings -> Actions -> General -> Workflow permissions ->**"
            echo "**Allow GitHub Actions to create and approve pull requests**, or add a"
            echo '`SYNC_PR_TOKEN` secret holding a PAT with `repo` scope.'
            echo
            echo "The synced data is on \`$branch\`. Open the PR here:"
            echo
            echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
          } >> "$GITHUB_STEP_SUMMARY"
