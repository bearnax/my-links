name: Sync links data from Airtable

on:
  workflow_dispatch:
    inputs:
      refresh_schema:
        description: Refresh field IDs (requires schema.bases:read)
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: links-airtable-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SYNC_BRANCH: links-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Find the current sync branch and pull request
        id: pending
        env:
          GH_TOKEN: ${{ secrets.SYNC_PR_TOKEN || github.token }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --head "$SYNC_BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          ref="refs/heads/$SYNC_BRANCH"
          current=$(git ls-remote --heads origin "$ref" | cut -f1)
          if [ -n "$pr" ]; then
            git fetch --no-tags origin "$ref"
            current=$(git rev-parse FETCH_HEAD)
            git show FETCH_HEAD:data/links.json > "$RUNNER_TEMP/pending-links.json"
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "sha=$current" >> "$GITHUB_OUTPUT"

      - name: Read Airtable and compare snapshots
        id: sync
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          REFRESH_SCHEMA: ${{ inputs.refresh_schema }}
        run: |
          set -euo pipefail
          if [ -z "$AIRTABLE_TOKEN" ]; then
            echo "::error::Set the AIRTABLE_TOKEN repository secret with data.records:read for the Links CMS base."
            exit 1
          fi
          if [ "$REFRESH_SCHEMA" = "true" ]; then
            python3 scripts/init-base.py --refresh
          fi
          pending="$RUNNER_TEMP/pending-links.json"
          python3 scripts/sync-links.py --pending "$pending" "$RUNNER_TEMP/links.json" 2>&1 | tee "$RUNNER_TEMP/links-sync.log"
          body="$RUNNER_TEMP/sync-summary.md"
          python3 scripts/diff-links.py data/links.json "$RUNNER_TEMP/links.json" > "$body"
          if ! git diff --quiet -- data/airtable-schema.json; then
            printf '\n- Refresh Airtable field mappings.\n' >> "$body"
          fi
          if grep -q '^warning:' "$RUNNER_TEMP/links-sync.log"; then
            printf '\n#### Airtable warnings\n\n' >> "$body"
            sed -n 's/^warning: /- /p' "$RUNNER_TEMP/links-sync.log" >> "$body"
          fi
          cat "$body" >> "$GITHUB_STEP_SUMMARY"
          cp "$RUNNER_TEMP/links.json" data/links.json
          if git diff --quiet -- data/airtable-schema.json data/links.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.sync.outputs.changed == 'true'
        with:
          node-version: "22"
          cache: npm

      - name: Verify the synced snapshot
        if: steps.sync.outputs.changed == 'true'
        run: |
          npm ci
          npm test
          test -s _site/index.html

      - name: Update the sync pull request
        env:
          GH_TOKEN: ${{ secrets.SYNC_PR_TOKEN || github.token }}
          PENDING_PR: ${{ steps.pending.outputs.pr }}
          PENDING_SHA: ${{ steps.pending.outputs.sha }}
          CHANGED: ${{ steps.sync.outputs.changed }}
        run: |
          set -euo pipefail
          if [ "$CHANGED" = "false" ]; then
            if [ -n "$PENDING_PR" ]; then
              gh pr close "$PENDING_PR"
            fi
            exit 0
          fi
          ref="refs/heads/$SYNC_BRANCH"
          if [ -n "$PENDING_PR" ] && git diff --quiet "$PENDING_SHA" -- data/airtable-schema.json data/links.json; then
            echo "The open sync PR already contains this snapshot." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/airtable-schema.json data/links.json
          git commit -m "Sync links data from Airtable"
          git push --force-with-lease="$ref:$PENDING_SHA" origin "HEAD:$ref"

          body="$RUNNER_TEMP/sync-summary.md"
          if [ -n "$PENDING_PR" ]; then
            gh pr edit "$PENDING_PR" --body-file "$body"
          elif ! gh pr create --base main --head "$SYNC_BRANCH" --title "Sync links data from Airtable" --body-file "$body"; then
            echo "Open the sync PR from the pushed branch:" >> "$GITHUB_STEP_SUMMARY"
            echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$SYNC_BRANCH?expand=1" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
