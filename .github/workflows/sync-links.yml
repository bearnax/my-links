name: Sync links data from sheet

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

env:
  SHEET_ID: "1-N1-rREX72eqmdyA-cGBr9UQsO2pGfTQ15KVFn5WH2k"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch sheet as CSV
        run: |
          curl -sSLf -o /tmp/links-sync.csv \
            "https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv"

      - name: Validate and convert sheet
        run: |
          python3 scripts/sync-links.py /tmp/links-sync.csv /tmp/links-sync-out.json \
            2>&1 | tee /tmp/links-sync-validate.log
          exit "${PIPESTATUS[0]}"
        shell: bash

      - name: Report validation failure
        if: failure()
        run: |
          {
            echo "### Sheet validation failed"
            echo '```'
            cat /tmp/links-sync-validate.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diff against data/links.json
        id: diff
        run: |
          if diff -q /tmp/links-sync-out.json data/links.json > /dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          python3 scripts/diff-links.py data/links.json /tmp/links-sync-out.json > /tmp/links-sync-summary.md
          cat /tmp/links-sync-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          # A PAT with repo scope in SYNC_PR_TOKEN lets the job open the PR even when
          # "Allow GitHub Actions to create and approve pull requests" is turned off.
          GH_TOKEN: ${{ secrets.SYNC_PR_TOKEN || github.token }}
        run: |
          branch="links-sync-$(date +%Y%m%d)"

          if gh pr list --head "$branch" --state open --json number --jq '. | length' | grep -qv '^0$'; then
            echo "An open PR already exists for branch $branch; skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$branch"
          cp /tmp/links-sync-out.json data/links.json
          git add data/links.json
          git commit -m "Sync links data from sheet"

          # Force is safe here: we bailed out above if an open PR targets this branch,
          # and links-sync-* branches are only ever written by this job. It lets a
          # rerun replace a leftover branch from an earlier run that failed after push.
          git push --force -u origin "$branch"

          if gh pr create \
            --title "Sync links data from sheet ($(date +%Y-%m-%d))" \
            --body-file /tmp/links-sync-summary.md \
            --base main \
            --head "$branch" 2> /tmp/links-sync-pr.log; then
            exit 0
          fi

          cat /tmp/links-sync-pr.log >&2

          if ! grep -q "not permitted to create or approve pull requests" /tmp/links-sync-pr.log; then
            exit 1
          fi

          # The synced data is pushed and safe; only PR creation is blocked by repo
          # policy. Surface the compare link instead of failing the whole sync.
          {
            echo "### Branch pushed, but the pull request could not be opened"
            echo
            echo "GitHub Actions is not allowed to create pull requests in this repository."
            echo "Turn on **Settings -> Actions -> General -> Workflow permissions ->**"
            echo "**Allow GitHub Actions to create and approve pull requests**, or add a"
            echo '`SYNC_PR_TOKEN` secret holding a PAT with `repo` scope.'
            echo
            echo "The synced data is on \`$branch\`. Open the PR here:"
            echo
            echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
          } >> "$GITHUB_STEP_SUMMARY"
